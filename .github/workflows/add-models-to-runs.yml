name: Add Models To Runs
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model IDs to add (e.g. potluck:swiss-ai/apertus-v1.5-70b)'
        required: true
      config_ids:
        description: 'Comma-separated config IDs whose latest run gets the models'
        required: true
      rebuild_summaries:
        description: 'Rebuild homepage, leaderboards and model summaries at the end (even if nothing changed)'
        type: boolean
        default: true
      rejudge:
        description: 'Judge the models again from their saved responses where a run already has them'
        type: boolean
        default: false
      retry_failed:
        description: 'Ask the models again where a run already has them but their answer failed'
        type: boolean
        default: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start the job on the server
        env:
          MODELS: ${{ github.event.inputs.models }}
          CONFIG_IDS: ${{ github.event.inputs.config_ids }}
          REBUILD: ${{ github.event.inputs.rebuild_summaries }}
          REJUDGE: ${{ github.event.inputs.rejudge }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed }}
        run: |
          BODY=$(python3 -c 'import json, os; split = lambda v: [x.strip() for x in v.split(",") if x.strip()]; print(json.dumps({"models": split(os.environ["MODELS"]), "configIds": split(os.environ["CONFIG_IDS"]), "rebuildSummaries": os.environ["REBUILD"] == "true", "rejudge": os.environ.get("REJUDGE") == "true", "retryFailed": os.environ.get("RETRY_FAILED") == "true"}))')
          # RAILWAY_APP_URL may redirect (http -> https, www -> apex); follow it as a POST.
          STATUS=$(curl -sS -L --post301 --post302 --post303 --max-time 60 -o response.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "X-Background-Function-Auth-Token: ${{ secrets.BACKGROUND_FUNCTION_AUTH_TOKEN }}" \
            -d "$BODY" \
            "${{ secrets.RAILWAY_APP_URL }}/api/internal/add-models-to-runs")
          cat response.txt; echo
          if [ "$STATUS" != "202" ]; then
            echo "::error::Expected 202 from the server, got $STATUS"
            exit 1
          fi
          echo "::notice::Started. Progress is in the Railway logs under 'add-models:' / '[AddModels]'."
